# Machine-specific temporary directories belong in local Gradle configuration.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on C: and the pub cache on D:; Kotlin incremental
# compilation cannot relativise paths across drive roots ("different roots"),
# so plugin modules fail to compile. Disable IC (small build-time cost).
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=37
