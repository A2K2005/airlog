# jdk.net.unixdomain.tmpdir: the default AF_UNIX socket dir is under the
# Windows user's temp path (contains a space); Java NIO then fails with
# "Unable to establish loopback connection". Point it at a short path.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=D:/dev/tmp -Djava.io.tmpdir=D:/dev/tmp
kotlin.daemon.jvmargs=-Djdk.net.unixdomain.tmpdir=D:/dev/tmp -Djava.io.tmpdir=D:/dev/tmp
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on C: and the pub cache on D:; Kotlin incremental
# compilation cannot relativise paths across drive roots ("different roots"),
# so plugin modules fail to compile. Disable IC (small build-time cost).
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=37
