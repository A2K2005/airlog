<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.ink{fill:#1E1C18}.ink2{fill:#5F594F}.ochre{fill:#8B5E12}.oxblood{fill:#7E2A33}
.b{font-weight:600}
.hair{stroke:#D6CDBD;stroke-width:1}
.flow{stroke:#1E1C18;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1,1 L9,5 L1,9" fill="none" stroke="#1E1C18" stroke-width="1.5"/>
</marker>
<marker id="arrSm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1,1 L9,5 L1,9" fill="none" stroke="#5F594F" stroke-width="1.5"/>
</marker>
<marker id="arrOx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1,1 L9,5 L1,9" fill="none" stroke="#7E2A33" stroke-width="1.8"/>
</marker>
<marker id="arrOc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1,1 L9,5 L1,9" fill="none" stroke="#B7822A" stroke-width="1.8"/>
</marker>
</defs>
<rect width="1200" height="690" fill="#F5F0E6"/>

<text class="serif ink" x="56" y="74" font-size="30">Coach: grounded, safe, private</text>
<text class="sans ink2" x="56" y="106" font-size="17">Every answer is checked against your own data before you see it</text>
<line x1="56" y1="132" x2="1144" y2="132" stroke="#1E1C18" stroke-width="1.5"/>

<!-- Column rules; the safety gate carries the oxblood -->
<g stroke="#1E1C18" stroke-width="1">
<line x1="56" y1="164" x2="180" y2="164"/>
<line x1="436" y1="164" x2="632" y2="164"/>
<line x1="672" y1="164" x2="916" y2="164"/>
<line x1="956" y1="164" x2="1144" y2="164"/>
</g>
<line x1="220" y1="164.5" x2="396" y2="164.5" stroke="#7E2A33" stroke-width="3"/>

<!-- Main pipeline -->
<path class="flow" d="M184,191 H209" marker-end="url(#arr)"/>
<path class="flow" d="M400,191 H425" marker-end="url(#arr)"/>
<text class="sans ink2" x="412" y="180" font-size="16" text-anchor="middle">ok</text>
<path class="flow" d="M636,191 H661" marker-end="url(#arr)"/>
<path class="flow" d="M920,191 H945" marker-end="url(#arr)"/>

<!-- 1. Question -->
<text class="serif ink" x="56" y="198" font-size="22">Question</text>
<text class="sans ink2" font-size="17"><tspan x="56" y="228">typed, or</tspan><tspan x="56" y="252">“Discuss” from</tspan><tspan x="56" y="276">an insight card</tspan></text>

<!-- 2. Red-flag check -->
<text class="serif ink" x="220" y="198" font-size="22">Red-flag check</text>
<text class="sans ink2" font-size="17"><tspan x="220" y="228">emergencies, dosing,</tspan><tspan x="220" y="252">self-harm, under-18</tspan><tspan x="220" y="288">runs before any</tspan><tspan x="220" y="312">model or tool</tspan></text>

<!-- 3. Grounded tools -->
<text class="serif ink" x="436" y="198" font-size="22">Grounded tools</text>
<text class="sans ink2" font-size="17"><tspan x="436" y="228">read-only, local data</tspan><tspan x="436" y="252">max 4 rounds</tspan><tspan x="436" y="276">consent + daily budget</tspan><tspan x="436" y="312">titles sent as quoted</tspan><tspan x="436" y="336">data, never instructions</tspan></text>

<!-- 4. Model: one provider's chain, then on-device -->
<text class="serif ink" x="672" y="198" font-size="22">Model</text>
<text class="sans ink2" x="672" y="228" font-size="17">your key, one provider</text>
<text class="sans ink2 b" x="672" y="266" font-size="16">Claude</text>
<text class="sans ink2 b" x="796" y="266" font-size="16">Gemini</text>
<line class="hair" x1="672" y1="276" x2="916" y2="276"/>
<text class="sans ink" font-size="17"><tspan x="672" y="300">Opus 5.5</tspan><tspan x="672" y="338">Sonnet 5.5</tspan><tspan x="672" y="376">Haiku 4.5</tspan></text>
<text class="sans ink" font-size="17"><tspan x="796" y="300">3.8 Flash</tspan><tspan x="796" y="338">3.5 Flash-Lite</tspan></text>
<g stroke="#5F594F" stroke-width="1.25" fill="none">
<path d="M678,306 V322" marker-end="url(#arrSm)"/>
<path d="M678,344 V360" marker-end="url(#arrSm)"/>
<path d="M802,306 V322" marker-end="url(#arrSm)"/>
<path d="M678,382 V406" marker-end="url(#arrSm)"/>
<path d="M802,344 V406" marker-end="url(#arrSm)"/>
</g>
<text class="sans ink" x="672" y="428" font-size="17">on-device answer, last resort</text>

<!-- 5. Verifier + policy -->
<text class="serif ink" x="956" y="198" font-size="22">Verifier + policy</text>
<text class="sans ink2" font-size="17"><tspan x="956" y="228">every number, date</tspan><tspan x="956" y="252">and event must match</tspan><tspan x="956" y="276">this turn’s tool data;</tspan><tspan x="956" y="300">no diagnosis or dosing</tspan></text>

<!-- Exits -->
<path d="M226,330 V496" stroke="#7E2A33" stroke-width="2" fill="none" marker-end="url(#arrOx)"/>
<text class="sans oxblood" x="238" y="424" font-size="16">red flag</text>

<path d="M962,318 V466 H684 V496" class="flow" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text class="sans ink2" x="700" y="488" font-size="16">fail</text>

<path d="M1072,318 V496" stroke="#B7822A" stroke-width="2" fill="none" marker-end="url(#arrOc)"/>
<text class="sans ochre" x="1084" y="424" font-size="16">pass</text>

<!-- Outcomes -->
<line x1="220" y1="507.5" x2="430" y2="507.5" stroke="#7E2A33" stroke-width="3"/>
<text class="sans oxblood b" x="220" y="536" font-size="17">Blocked</text>
<text class="sans ink b" x="220" y="564" font-size="18">Fixed safety message</text>
<text class="sans ink2" x="220" y="588" font-size="17">never reaches a model</text>

<line x1="672" y1="507" x2="916" y2="507" stroke="#1E1C18" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="sans ink2 b" x="672" y="536" font-size="17">Fallback</text>
<text class="sans ink b" x="672" y="564" font-size="18">Facts table only</text>
<text class="sans ink2" x="672" y="588" font-size="17">after one failed repair</text>

<line x1="956" y1="507.5" x2="1144" y2="507.5" stroke="#B7822A" stroke-width="3"/>
<text class="sans ochre b" x="956" y="536" font-size="17">Passed</text>
<text class="sans ink b" x="956" y="564" font-size="18">Answer + sources</text>
<text class="sans ink2" x="956" y="588" font-size="17">every number checked</text>

<!-- Privacy -->
<line class="hair" x1="56" y1="622" x2="1144" y2="622"/>
<text class="sans ink2" x="56" y="656" font-size="17"><tspan class="ink b">Privacy</tspan><tspan dx="14">on-device by default</tspan> · your own key · Google Health API data never sent · “What was sent” on every answer</text>
</svg>
