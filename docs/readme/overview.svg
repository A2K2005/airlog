<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648">
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.ink{fill:#1E1C18}.ink2{fill:#5F594F}.ochre{fill:#8B5E12}
.b{font-weight:600}
.hair{stroke:#D6CDBD;stroke-width:1}
.flow{stroke:#1E1C18;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1,1 L9,5 L1,9" fill="none" stroke="#1E1C18" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1200" height="648" fill="#F5F0E6"/>

<text class="serif ink" x="56" y="74" font-size="30">How Airlog works</text>
<text class="sans ink2" x="56" y="106" font-size="17">Any wearable app in, one explainable morning answer out, computed on the phone</text>
<line x1="56" y1="132" x2="1144" y2="132" stroke="#1E1C18" stroke-width="1.5"/>

<!-- The phone boundary: Airlog's part of the flow -->
<rect x="288" y="152" width="856" height="374" fill="#ECE5D6"/>
<text class="sans ink2 b" x="312" y="182" font-size="17">Airlog, on your phone</text>

<!-- Column rules; the answer column carries the accent -->
<g stroke="#1E1C18" stroke-width="1">
<line x1="56" y1="204" x2="256" y2="204"/>
<line x1="312" y1="204" x2="544" y2="204"/>
<line x1="600" y1="204" x2="832" y2="204"/>
</g>
<line x1="888" y1="204.5" x2="1120" y2="204.5" stroke="#B7822A" stroke-width="3"/>

<!-- Flow between stages -->
<path class="flow" d="M264,231 H304" marker-end="url(#arr)"/>
<path class="flow" d="M552,231 H592" marker-end="url(#arr)"/>
<path class="flow" d="M840,231 H880" marker-end="url(#arr)"/>

<!-- 1. Health Connect, fed by any wearable app -->
<text class="serif ink" x="56" y="238" font-size="22">Health Connect</text>
<text class="sans ink2" font-size="17"><tspan x="56" y="266">Android’s on-device</tspan><tspan x="56" y="290">health store</tspan></text>
<path class="flow" d="M62,500 V304" marker-end="url(#arr)"/>
<path class="flow" d="M62,360 H72 M62,388 H72 M62,416 H72 M62,444 H72 M62,472 H72 M62,500 H72"/>
<text class="sans ink b" x="80" y="336" font-size="17">Your wearable app</text>
<text class="sans ink" font-size="17">
<tspan x="80" y="366">Google Health</tspan>
<tspan x="80" y="394">Samsung Health</tspan>
<tspan x="80" y="422">Oura</tspan>
<tspan x="80" y="450">WHOOP</tspan>
<tspan x="80" y="478">Garmin</tspan>
<tspan x="80" y="506" class="ink2">+ any app</tspan>
</text>

<!-- 2. Source picker -->
<text class="serif ink" x="312" y="238" font-size="22">Source picker</text>
<text class="sans ink2" font-size="17"><tspan x="312" y="266">one app per metric, never</tspan><tspan x="312" y="290">summed or averaged</tspan></text>
<line class="hair" x1="312" y1="310" x2="544" y2="310"/>
<text class="sans ink b" x="312" y="340" font-size="17">New watch</text>
<text class="sans ink2" x="312" y="364" font-size="17">starts a fresh baseline</text>
<line class="hair" x1="312" y1="382" x2="544" y2="382"/>
<text class="sans ink b" x="312" y="408" font-size="17">Switches apps</text>
<text class="sans ink2" x="312" y="432" font-size="17">only after 4 silent days</text>
<line class="hair" x1="312" y1="450" x2="544" y2="450"/>
<text class="sans ink b" x="312" y="476" font-size="17">Missing signal</text>
<text class="sans ink2" x="312" y="500" font-size="17">flagged, never guessed</text>

<!-- 3. Score engine -->
<text class="serif ink" x="600" y="238" font-size="22">Score engine</text>
<text class="sans ink2" x="600" y="266" font-size="17">against your own baseline</text>
<line class="hair" x1="600" y1="310" x2="832" y2="310"/>
<text class="sans ink" x="600" y="340" font-size="19">Recovery</text>
<line class="hair" x1="600" y1="352" x2="832" y2="352"/>
<text class="sans ink" x="600" y="374" font-size="19">Strain</text>
<line class="hair" x1="600" y1="386" x2="832" y2="386"/>
<text class="sans ink" x="600" y="408" font-size="19">Sleep</text>
<line class="hair" x1="600" y1="420" x2="832" y2="420"/>
<text class="sans ink" x="600" y="442" font-size="19">Health Monitor</text>
<line class="hair" x1="600" y1="454" x2="832" y2="454"/>
<text class="sans ink2" font-size="17"><tspan x="600" y="476">Pure Dart</tspan><tspan x="600" y="500">Algorithm-versioned</tspan></text>

<!-- 4. TodayPlan: the answer -->
<text class="serif ink" x="888" y="238" font-size="22">TodayPlan</text>
<text class="serif ochre" x="888" y="268" font-size="20" font-style="italic">How am I + what to do</text>
<line class="hair" x1="888" y1="310" x2="1120" y2="310"/>
<g fill="#B7822A">
<rect x="888" y="328" width="7" height="7"/>
<rect x="888" y="362" width="7" height="7"/>
<rect x="888" y="396" width="7" height="7"/>
<rect x="888" y="430" width="7" height="7"/>
</g>
<text class="sans ink" x="906" y="340" font-size="18">state in plain words</text>
<line class="hair" x1="888" y1="352" x2="1120" y2="352"/>
<text class="sans ink" x="906" y="374" font-size="18">why, with the numbers</text>
<line class="hair" x1="888" y1="386" x2="1120" y2="386"/>
<text class="sans ink" x="906" y="408" font-size="18">0–3 actions</text>
<line class="hair" x1="888" y1="420" x2="1120" y2="420"/>
<text class="sans ink" x="906" y="442" font-size="18">what it’s based on</text>
<line class="hair" x1="888" y1="454" x2="1120" y2="454"/>
<text class="sans ink2" x="888" y="476" font-size="17">Deterministic</text>

<!-- How it's built -->
<line class="hair" x1="56" y1="560" x2="1144" y2="560"/>
<text class="sans ink b" x="56" y="592" font-size="17">Clean Architecture</text>
<text class="sans ink2" x="56" y="616" font-size="17">screens never import the data layer</text>
<text class="sans ink b" x="420" y="592" font-size="17">Pure-Dart score engine</text>
<text class="sans ink2" x="420" y="616" font-size="17">runs without a device, versioned formulas</text>
<text class="sans ink b" x="784" y="592" font-size="17">Private by default</text>
<text class="sans ink2" x="784" y="616" font-size="17">no Airlog server, no account, no analytics</text>
</svg>
